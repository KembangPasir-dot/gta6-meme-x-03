<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="LEONIDA WORLD theme park ticket: waited 4,811 days in line for Grand Theft Auto VI">
  <title>LEONIDA WORLD — ADMIT ONE</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6e"/>
      <stop offset="0.45" stop-color="#ff7a6b"/>
      <stop offset="0.8" stop-color="#c94b8a"/>
      <stop offset="1" stop-color="#6b2d8f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
