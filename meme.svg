  <text x="330" y="588" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="50" font-weight="900" fill="#191419">YOU WAITED IN LINE</text>
  <text x="330" y="690" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="98" font-weight="900" fill="#c41c83">4,811 DAYS</text>
